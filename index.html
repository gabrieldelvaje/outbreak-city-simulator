<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f3f1" />
  <meta name="description" content="Mapa-base interativo de Piracicaba, preparado para receber patrimônio, fotografias históricas e landmarks 3D personalizados." />
  <title>Piracicaba 3D</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Piracicaba 3D — início">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>PIRACICABA</span>
        <span class="brand-slash">/</span>
        <strong>MAPA</strong>
      </a>

      <div class="topbar-right">
        <span class="version">V1</span>
        <span id="map-status" class="status" role="status" aria-live="polite">Carregando mapa…</span>
      </div>
    </header>

    <main class="map-stage">
      <div id="map" aria-label="Mapa interativo de Piracicaba"></div>

      <section class="map-caption" aria-label="Sobre esta versão">
        <p class="eyebrow">MAPA-BASE · V1</p>
        <h1>Piracicaba.</h1>
        <p>Primeira versão da base cartográfica. O mapa fica limitado ao município; patrimônio, fotos históricas e modelos 3D personalizados entram nas próximas etapas.</p>
      </section>

      <div class="map-actions" aria-label="Controles de visualização">
        <button id="reset-view" class="action-button" type="button" title="Enquadrar Piracicaba inteira">
          <span class="action-icon" aria-hidden="true">⌖</span>
          <span>Enquadrar</span>
        </button>
      </div>

      <div class="map-key">
        <span><i class="key-swatch boundary"></i> limite municipal</span>
        <span>IBGE · MapLibre · OpenFreeMap · OpenStreetMap</span>
      </div>
    </main>

    <noscript>Este mapa precisa de JavaScript para funcionar.</noscript>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

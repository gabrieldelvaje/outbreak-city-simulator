<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f3f1" />
  <meta name="description" content="Mapa interativo das linhas de ônibus de Piracicaba, com catálogo oficial e traçados abertos." />
  <title>Piracicaba — Transporte Público</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org" />
  <link rel="preconnect" href="https://unpkg.com" crossorigin />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.12.0/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Piracicaba — mapa">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>PIRACICABA</span>
        <span class="brand-slash">/</span>
        <strong>MAPA</strong>
      </a>

      <nav class="section-nav" aria-label="Camadas do mapa">
        <a href="./historia.html">HISTÓRIA</a>
        <a class="is-active" href="./" aria-current="page">TRANSPORTE</a>
      </nav>

      <div class="topbar-right">
        <span class="version">V1</span>
        <span id="map-status" class="status" role="status" aria-live="polite">Carregando mapa…</span>
      </div>
    </header>

    <main class="map-stage">
      <div id="map" aria-label="Mapa das linhas de ônibus de Piracicaba"></div>

      <section id="route-panel" class="route-panel" aria-label="Linhas de ônibus">
        <button id="panel-toggle" class="panel-handle" type="button" aria-expanded="true" aria-label="Abrir ou fechar lista de linhas">
          <span></span>
        </button>

        <div class="panel-heading">
          <div>
            <p class="eyebrow">TRANSPORTE PÚBLICO · V1</p>
            <h1>Linhas de ônibus</h1>
          </div>
          <button id="show-network" class="network-button" type="button">Rede inteira</button>
        </div>

        <label class="search-box">
          <span class="search-icon" aria-hidden="true">⌕</span>
          <input id="route-search" type="search" placeholder="Buscar linha ou destino" autocomplete="off" />
        </label>

        <div class="route-summary">
          <span id="route-count">Carregando traçados…</span>
          <span>catálogo atual</span>
        </div>

        <div id="route-list" class="route-list" aria-live="polite"></div>

        <div class="panel-source">
          <span>Linhas: Pira Mobilidade</span>
          <span>Traçados: OpenStreetMap</span>
        </div>
      </section>

      <aside id="selected-route" class="selected-route" hidden>
        <span class="selected-swatch" aria-hidden="true"></span>
        <div class="selected-copy">
          <strong id="selected-ref"></strong>
          <span id="selected-name"></span>
        </div>
        <button id="close-selected" type="button" aria-label="Voltar para a rede inteira">×</button>
      </aside>

      <button id="reset-view" class="reset-button" type="button" title="Mostrar a rede inteira">
        <span aria-hidden="true">↗</span>
        <span>Rede inteira</span>
      </button>
    </main>

    <noscript>Este mapa precisa de JavaScript para funcionar.</noscript>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>

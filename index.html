<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#f3f3f1" />
  <meta name="description" content="Piracicaba 3D — uma base cartográfica interativa para explorar a cidade e, nas próximas versões, seu patrimônio histórico." />
  <title>Piracicaba 3D</title>
  <link rel="preconnect" href="https://tiles.openfreemap.org" />
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.css" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="Piracicaba 3D — início">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>PIRACICABA</span>
        <span class="brand-slash">/</span>
        <strong>3D</strong>
      </a>
      <div class="topbar-right">
        <span class="version">V1</span>
        <span id="map-status" class="status" role="status" aria-live="polite">Carregando mapa…</span>
      </div>
    </header>

    <main class="map-stage">
      <div id="map" aria-label="Mapa tridimensional interativo de Piracicaba"></div>

      <section class="map-caption" aria-label="Sobre esta versão">
        <p class="eyebrow">BASE CARTOGRÁFICA · V1</p>
        <h1>Piracicaba em volume.</h1>
        <p>Uma primeira camada 3D da cidade. Patrimônio, fotografias históricas e marcos modelados individualmente entram nas próximas versões.</p>
      </section>

      <div class="map-actions" aria-label="Controles de visualização">
        <button id="view-toggle" class="action-button is-active" type="button" aria-pressed="true" title="Alternar visualização 3D">
          <span class="action-icon" aria-hidden="true">◇</span>
          <span>3D</span>
        </button>
        <button id="reset-view" class="action-button" type="button" title="Voltar para o centro de Piracicaba">
          <span class="action-icon" aria-hidden="true">↗</span>
          <span>Centro</span>
        </button>
      </div>

      <div class="map-key">
        <span><i class="key-swatch"></i> edifícios extrudados</span>
        <span>MapLibre · OpenFreeMap · OpenStreetMap</span>
      </div>
    </main>

    <noscript>Este mapa precisa de JavaScript para funcionar.</noscript>
  </div>

  <script src="https://unpkg.com/maplibre-gl@6.11.2/dist/maplibre-gl.js"></script>
  <script src="./app.js"></script>
</body>
</html>
